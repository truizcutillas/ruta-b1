<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E47D6">
<title>Ruta B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one-column app, units as stations on a vertical line toward B2; lessons are full-screen exercise cards */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E6EAF5; --ink:#161C38; --muted:#5A6283; --line:#D3D9EA;
  --accent:#2E47D6; --accent-deep:#1E31A3; --accent-soft:#E2E7FF; --accent-ink:#FFFFFF;
  --warm:#E99200; --warm-soft:#FFF0D2;
  --good:#18895E; --good-soft:#DCF4E8; --bad:#C93A3A; --bad-soft:#FBE2E2; --heart:#DE3D5B;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1328; --surface:#181E3B; --sunk:#222A50; --ink:#ECEFFC; --muted:#99A2C8; --line:#2C3462;
  --accent:#7A8CFF; --accent-deep:#4656CC; --accent-soft:#252E6B; --accent-ink:#0F1328;
  --warm:#FFB52E; --warm-soft:#3A2E12;
  --good:#3CCB8F; --good-soft:#143A2C; --bad:#FF7070; --bad-soft:#401D24; --heart:#FF5C7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1328; --surface:#181E3B; --sunk:#222A50; --ink:#ECEFFC; --muted:#99A2C8; --line:#2C3462;
  --accent:#7A8CFF; --accent-deep:#4656CC; --accent-soft:#252E6B; --accent-ink:#0F1328;
  --warm:#FFB52E; --warm-soft:#3A2E12;
  --good:#3CCB8F; --good-soft:#143A2C; --bad:#FF7070; --bad-soft:#401D24; --heart:#FF5C7A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.stats{display:flex;gap:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:4px}
.stat.fire{color:var(--warm)} .stat.xp{color:var(--accent)} .stat.hp{color:var(--heart)}
.stat.off{color:var(--muted)}

main{padding-block:18px 110px}

/* goal card */
.goal{display:flex;gap:16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:28px}
.ring{width:64px;height:64px;flex:none}
.goal h3{font-size:18px;margin-bottom:2px}
.goal p{margin:0;color:var(--muted);font-size:14px}

/* units & track */
.unit{margin-bottom:30px}
.unit-head{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 var(--accent-deep)}
.unit-head .eyebrow{color:inherit;opacity:.8}
.unit-head h2{font-size:22px;margin:4px 0 6px}
.unit-head p{margin:0;font-size:14px;opacity:.9}
.unit.locked .unit-head{background:var(--sunk);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.unit.complete .unit-head{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 70%,#000)}
.track{list-style:none;margin:18px 0 0;padding:0 0 0 58px;position:relative;display:grid;gap:14px}
.track::before{content:"";position:absolute;left:25px;top:6px;bottom:6px;width:6px;border-radius:3px;background:var(--line)}
.stop{position:relative;display:flex;align-items:center;gap:12px;min-height:52px}
.node{position:absolute;left:-52px;top:50%;translate:0 -50%;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);border:4px solid var(--bg)}
.stop.done .node{background:var(--accent);color:var(--accent-ink)}
.stop.current .node{background:var(--warm);color:#1d1400;box-shadow:0 0 0 0 var(--warm);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warm) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.stop-txt{flex:1;min-width:0}
.stop-txt strong{display:block;font-size:16px}
.stop-txt span{font-size:13px;color:var(--muted)}
.stop.locked .stop-txt{opacity:.55}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 3px 0 var(--line)}
.mini.go{background:var(--warm);border-color:var(--warm);color:#1d1400;box-shadow:0 3px 0 color-mix(in srgb,var(--warm) 65%,#000)}
.mini:disabled{opacity:.45;cursor:not-allowed}
.finish{display:flex;align-items:center;gap:12px;padding:18px;border:2px dashed var(--line);border-radius:20px;color:var(--muted);font-weight:700}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 65%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 65%,#000)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tab{border:2px solid transparent;background:none;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tab svg.i{width:24px;height:24px}

/* cards in review / profile */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:6px}
.card p{margin:0 0 14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:6px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.bar.met i{background:var(--warm)}
.bar.today span{color:var(--ink);font-weight:800}
.meter{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;margin:4px 0 8px}
.meter i{display:block;height:100%;background:var(--good);border-radius:7px}
details.rule{border-top:2px solid var(--line);padding:12px 0}
details.rule:first-of-type{border-top:0}
details.rule summary{font-weight:700;cursor:pointer}
details.rule div{color:var(--muted);margin-top:8px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:2px solid var(--line)}
.row:first-of-type{border-top:0}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}

/* lesson overlay */
#lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#lesson[hidden]{display:none!important}
.l-head{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{border:0;background:none;color:var(--muted);padding:4px;display:grid}
.x svg.i{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:8px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--good);border-radius:8px;transition:width .35s ease}
.l-body{flex:1;overflow-y:auto}
.l-body .wrap{padding-block:8px 24px}
.kind{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kind.again{color:var(--warm)}
.q{font-family:var(--f-display);font-size:24px;font-weight:800;margin:0 0 20px;text-wrap:balance}
.es{font-size:20px;font-weight:600;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:20px}
.sent{font-size:22px;font-weight:600;line-height:1.6;margin-bottom:24px}
.slot{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;padding:0 6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.answer-line{min-height:120px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:12px;margin-bottom:22px;background-image:linear-gradient(var(--line),var(--line));background-size:100% 2px;background-position:0 58px;background-repeat:no-repeat}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-size:17px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
textarea{width:100%;min-height:120px;font:inherit;font-size:18px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.speak{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
.spk{width:96px;height:96px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 5px 0 var(--accent-deep)}
.spk.slow{width:64px;height:64px;align-self:end;border-radius:18px;background:var(--accent-soft);color:var(--accent);box-shadow:0 4px 0 var(--line)}
.spk svg.i{width:40px;height:40px}.spk.slow svg.i{width:26px;height:26px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.mt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--line);min-height:56px}
.mt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mt.ok{opacity:.35;cursor:default;border-color:var(--good)}
.mt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.l-foot{border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.l-foot .wrap{padding-block:16px}
.l-foot.good{background:var(--good-soft);border-color:transparent}
.l-foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:none;margin-bottom:14px}
.l-foot.good .fb,.l-foot.bad .fb{display:block}
.fb h3{font-size:22px;display:flex;align-items:center;gap:8px}
.l-foot.good .fb h3{color:var(--good)} .l-foot.bad .fb h3{color:var(--bad)}
.fb .ans{font-weight:700;margin:6px 0 4px;display:flex;align-items:center;gap:8px}
.fb .ans button{border:0;background:none;color:inherit;padding:2px;display:grid}
.fb .tip{font-size:15px;color:var(--ink);opacity:.85}

/* result & dialogs */
.result{text-align:center;padding-block:40px 20px}
.result h1{font-size:34px;margin:16px 0 8px}
.result p{color:var(--muted);margin:0 0 26px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.trio div{border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--surface)}
.trio b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.trio span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.badge{width:110px;height:110px;margin:0 auto;border-radius:32px;display:grid;place-items:center;background:var(--warm-soft);color:var(--warm)}
.badge svg.i{width:60px;height:60px}
.badge.sad{background:var(--bad-soft);color:var(--heart)}
#dlg{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
#dlg .box{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
#dlg h3{font-size:22px} #dlg p{margin:0;color:var(--muted)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.auth-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.sync{font-size:14px;color:var(--muted);margin:0 0 14px}
.sync.err{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* B2 additions */
.inl{font:inherit;font-size:20px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-bottom:3px solid var(--accent);border-radius:8px 8px 0 0;padding:2px 8px;max-width:100%;margin:2px 0;vertical-align:baseline}
.stem-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 22px;font-size:13px;font-weight:700;color:var(--muted)}
.chip{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;background:var(--warm-soft);color:var(--ink);border:2px solid var(--warm);border-radius:10px;padding:3px 12px}
.note{font-size:14px;color:var(--muted);margin:-12px 0 0}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:7px 11px;font-size:19px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.tok[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tok.right{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.tok.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
details.theory{margin-top:12px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:10px}
details.theory summary{cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
details.theory div{font-size:14px;line-height:1.55;margin-top:8px}
.stop.exam .node{border-radius:12px}
.stop.free .node{background:var(--accent-soft);color:var(--accent)}
.btn-col{display:grid;gap:10px}
.field{display:grid;gap:6px;margin-bottom:12px}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Ruta <b>B2</b></div>
  <div class="stats" id="stats"></div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Secciones"><div class="wrap">
  <button class="tab" data-tab="ruta"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.5 5H15a3.5 3.5 0 0 1 0 7H9a3.5 3.5 0 0 0 0 7h6.5"/></svg>Ruta</button>
  <button class="tab" data-tab="repaso"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Repaso</button>
  <button class="tab" data-tab="progreso"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Progreso</button>
</div></nav>

<section id="lesson" hidden>
  <div class="wrap l-head">
    <button class="x" id="quit" aria-label="Salir de la lección"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="prog"><i id="bar"></i></div>
    <div class="stat hp" id="lhp"></div>
  </div>
  <div class="l-body"><div class="wrap" id="ex"></div></div>
  <div class="l-foot" id="foot"><div class="wrap">
    <div class="fb" id="fb"></div>
    <button class="btn" id="go" disabled>Comprobar</button>
  </div></div>
</section>
<div id="dlg" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* ---------- content ---------- */
const G=(s,o,tip)=>({t:'gap',s,o,tip});              // o[0] es la correcta
const M=(q,o,tip)=>({t:'mc',q,o,tip});                // o[0] es la correcta
const O=(es,en,extra,tip)=>({t:'order',es,en,extra,tip});
const W=(es,ans,tip)=>({t:'write',es,ans,tip});
const H=(en,es,extra)=>({t:'listen',en,es,extra});
const P=pairs=>({t:'match',pairs});
const OC=(s,ans,tip)=>({t:'open',s,ans,tip});
const WF=(s,stem,ans,tip)=>({t:'wf',s,stem,ans,tip});
const K=(s1,key,s2,ans,tip)=>({t:'kwt',s1,key,s2,ans,tip});
const E=(s,fix,tip)=>({t:'err',s,fix,tip});            // *palabra* marcada = la incorrecta

const UNITS=[
/* 1 */
{title:"Contar historias",can:"Narrar con precisión qué pasó antes, qué estaba pasando y qué llevaba tiempo pasando.",
 key:"<b>Past perfect</b> (had + participio): lo anterior a otro pasado. <b>Past perfect continuous</b> (had been + -ing): duración hasta un momento pasado. <b>Past continuous</b>: acción en curso interrumpida. <b>would / used to</b>: hábitos pasados (used to no lleva duración concreta).",
 items:[
 G("By the time we arrived, the film ___.",["had already started","already started","has already started"],"Acción anterior a otro pasado: past perfect."),
 G("She was exhausted because she ___ all day.",["had been working","has been working","was worked"],"Duración hasta un momento del pasado: past perfect continuous."),
 G("When I got home, I realised I ___ my keys at the office.",["had left","have left","was leaving"],"Dejar las llaves ocurrió antes de darse cuenta."),
 G("They ___ for two hours when the rescue team found them.",["had been walking","were walking","have walked"],"for + duración antes de otra acción pasada."),
 G("It was the first time I ___ such a beautiful place.",["had seen","saw","have seen"],"It was the first time + past perfect."),
 G("As a child, I ___ spend hours reading in my room.",["would","was","had"],"would + infinitivo para hábitos repetidos del pasado."),

function merge(l,r){
  r=(r&&r.v===2)?fix(r):Object.assign(carry(r),{updated:0});
  const m=Object.assign({},l);
  m.xp=Math.max(l.xp,r.xp);
  m.prog=l.prog.map((p,i)=>Math.max(p,r.prog[i]||0));
  m.days=Object.assign({},r.days);for(const k in l.days)m.days[k]=Math.max(l.days[k],m.days[k]||0);
  m.seen=Object.assign({},r.seen);for(const k in l.seen)m.seen[k]=Math.max(l.seen[k],m.seen[k]||0);
  m.best=Math.max(l.best,r.best);
  if((r.last||'')>(l.last||'')){m.last=r.last;m.streak=r.streak}
  else if(r.last===l.last)m.streak=Math.max(l.streak,r.streak);
  const newer=(r.updated||0)>(l.updated||0)?r:l;
  m.mist=newer.mist.slice();m.goal=newer.goal;m.unlockAll=newer.unlockAll;
  m.updated=Math.max(l.updated||0,r.updated||0);
  return m;
}
async function pull(){
  if(!user)return;
  syncMsg='Sincronizando…';syncErr=false;refreshView();
  const{data,error}=await sb.from('progress').select('data').eq('user_id',user.id).maybeSingle();
  if(error){syncMsg='No se pudo leer tu progreso: '+error.message;syncErr=true;refreshView();return}
  if(data&&data.data){S=merge(S,data.data);saveLocal()}
  await push();
}
function schedulePush(){if(!user)return;clearTimeout(pushT);pushT=setTimeout(push,1500)}
async function push(){
  if(!user)return;
  const{error}=await sb.from('progress').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});
  if(error){syncMsg='No se pudo guardar en la nube: '+error.message;syncErr=true}
  else{const d=new Date();syncMsg='Guardado en la nube a las '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');syncErr=false}

}

function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'");
  s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot').replace(/\bshan't\b/g,'shall not').replace(/n't\b/g,' not')
     .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'d\b/g,' would')
     .replace(/\bcan not\b/g,'cannot');
  s=s.replace(/\b(real|recogn|apolog|organ|critic|emphas|summar|memor|special|practi)is(e|ed|es|ing)\b/g,'$1iz$2')
     .replace(/\bfavour/g,'favor').replace(/\b(cancel|travel)l(ed|ing)\b/g,'$1$2')
     .replace(/\bwould (been|known|had|gone|seen|done|left|finished|eaten|made|taken|said|told)\b/g,'had $1'); // I'd known = I had known
  return s.replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function anyMatch(v,list,tol){
  const nv=norm(v);
  for(const a of list)if(norm(a)===nv)return{ok:true,a};
  if(tol)for(const a of list){const n=norm(a);if(n.length>=7&&lev(nv,n)<=Math.max(1,Math.floor(n.length/18)))return{ok:true,a,typo:true}}
  return{ok:false,a:list[0]};
}

}

/* ---------- selección de ejercicios ---------- */
const EXAM_T=['kwt','wf','open','err','write'], EASY_T=['gap','mc','match','order'];
const CAP={match:1,listen:2,write:2};
function modeFor(d,typedChance){
  if(d.t==='gap')return Math.random()<typedChance?'typed':'opt';
  if(d.t==='listen')return canSpeak&&Math.random()<typedChance*.8?'typed':'tiles';
  return '';
}
// Prioriza los ejercicios que menos has visto, con algo de azar
function pick(pool,k,opts){
  opts=opts||{};
  const cand=pool.map(r=>{const d=UNITS[r.u].items[r.i];let sc=(S.seen[r.u+'-'+r.i]||0)+Math.random()*1.6;
    if(opts.exam&&EXAM_T.includes(d.t))sc-=1.4;
    if(opts.easy&&EASY_T.includes(d.t))sc-=.8;
    if(opts.easy&&['kwt','err'].includes(d.t))sc+=1;
    return{r,d,sc}}).sort((a,b)=>a.sc-b.sc);
  const out=[],cnt={};
  for(const c of cand){if(out.length>=k)break;const t=c.d.t;if(CAP[t]&&(cnt[t]||0)>=CAP[t])continue;cnt[t]=(cnt[t]||0)+1;out.push(c)}
  for(const c of cand){if(out.length>=k)break;if(!out.includes(c))out.push(c)}
  return shuffle(out).map(c=>({u:c.r.u,i:c.r.i,mode:modeFor(c.d,opts.typed||0)}));
}
const unitPool=u=>UNITS[u].items.map((_,i)=>({u,i}));
function startLesson(u,n){
  refreshHearts();if(S.hearts===0){render();return}
  const Ls=LESSONS[n];
  begin(pick(unitPool(u),Ls.k,{exam:Ls.exam,easy:n===0,typed:Ls.typed?(Ls.exam?.75:.6):0}),{mode:'unit',u,n});
}
function startPractice(u){
  refreshHearts();if(S.hearts===0){render();return}
  begin(pick(unitPool(u),10,{typed:.5}),{mode:'practice',u});
}
function startReview(kind){
  let q;
  if(kind==='mist'){
    q=shuffle(S.mist).slice(0,10).map(id=>{const[u,i]=id.split('-').map(Number);return{u,i}}).filter(r=>UNITS[r.u]&&UNITS[r.u].items[r.i]).map(r=>({u:r.u,i:r.i,mode:modeFor(UNITS[r.u].items[r.i],.3)}));
  }else{
    const us=UNITS.map((_,u)=>u).filter(u=>unitOpen(u)&&(S.prog[u]>0||u===0));
    q=pick(us.flatMap(unitPool),10,{typed:.4});
  }
  if(!q.length)return;
  begin(q,{mode:'review'});
}

/* ---------- lesson engine ---------- */
function begin(items,meta){
  L=Object.assign({queue:items,pos:0,total:items.length,done:0,xp:0,miss:0,missed:new Set(),phase:'ask'},meta);
  $('#lesson').hidden=false;document.body.style.overflow='hidden';
  showEx();
}
function cur(){const r=L.queue[L.pos];return{r,d:UNITS[r.u].items[r.i],id:r.u+'-'+r.i}}
function setFoot(state,html){$('#foot').className='l-foot'+(state?' '+state:'');$('#fb').innerHTML=html||''}
function lessonHearts(){$('#lhp').innerHTML=L.mode==='review'?'':I.heart+S.hearts}
function kindLabel(d,mode){
  return {gap:mode==='typed'?'Escribe lo que falta':'Completa la frase',mc:'Elige la respuesta',order:'Traduce esta frase',write:'Escribe en inglés',
    listen:mode==='typed'?'Dictado: escribe lo que oyes':'Ordena lo que oyes',match:'Une las parejas',open:'Escribe una sola palabra',
    wf:'Forma la palabra correcta',kwt:'Transforma la frase',err:'Toca la palabra incorrecta'}[d.t];
}
function inl(s,ans,wide){
  const w=(wide?Math.max(16,ans.length+5):Math.max(6,ans.length+3))+(Math.random()*3|0);
  return esc(s).replace('___',`<input class="inl" id="inp" style="width:${w}ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Tu respuesta">`);
}
function bindInput(){
  const inp=$('#inp'),go=$('#go');
  inp.oninput=()=>go.disabled=!inp.value.trim();
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!go.disabled)go.click()}};
  setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},60);
}
function speakBtns(en){return `<div class="speak"><button class="spk" id="spk" aria-label="Escuchar">${I.speaker}</button><button class="spk slow" id="spkS" aria-label="Escuchar despacio">${I.turtle}</button></div>`}
function bindSpeak(en){$('#spk').onclick=()=>speak(en);$('#spkS').onclick=()=>speak(en,.6);setTimeout(()=>speak(en),250)}

function showEx(){
  const{d,id,r}=cur();
  $('#bar').style.width=(L.done/L.total*100)+'%';lessonHearts();
  L.phase='ask';L.sel=null;setFoot('');
  const go=$('#go');go.textContent='Comprobar';go.disabled=true;go.className='btn';go.hidden=false;
  const again=L.missed.has(id);
  let h=`<div class="kind ${again?'again':''}">${again?'Otra vez · ':''}${kindLabel(d,r.mode)}</div>`;
  const ex=$('#ex');
  if((d.t==='gap'&&r.mode!=='typed')||d.t==='mc'){
    L.opts=shuffle(d.o);
    h+=d.t==='gap'?`<div class="sent">${esc(d.s).replace('___','<span class="slot" id="slot">&nbsp;</span>')}</div>`:`<h2 class="q">${esc(d.q)}</h2>`;
    h+=`<div class="opts">${L.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`;
    ex.innerHTML=h;
    ex.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(L.phase!=='ask')return;
      ex.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');

  }
  else if(d.t==='gap'||d.t==='open'||d.t==='wf'){
    h+=`<div class="sent">${inl(d.s,d.t==='gap'?d.o[0]:d.ans[0])}</div>`;
    if(d.t==='wf')h+=`<div class="stem-row"><span>Palabra base</span><b class="chip">${esc(d.stem)}</b></div>`;
    if(d.t==='open')h+=`<p class="note">Una sola palabra en cada hueco.</p>`;
    ex.innerHTML=h;bindInput();
  }
  else if(d.t==='kwt'){
    h+=`<div class="es">${esc(d.s1)}</div><div class="stem-row"><span>Palabra clave (no la cambies)</span><b class="chip">${esc(d.key)}</b></div><div class="sent">${inl(d.s2,d.ans[0],true)}</div><p class="note">Escribe entre 2 y 5 palabras, incluida la palabra clave.</p>`;
    ex.innerHTML=h;bindInput();
  }
  else if(d.t==='err'){
    const toks=d.s.split(' ');L.bad=toks.map((t,k)=>t.includes('*')?k:-1).filter(k=>k>=0);
    h+=`<div class="toks">${toks.map((t,k)=>`<button class="tok" data-t="${k}" aria-pressed="false">${esc(t.replace(/\*/g,''))}</button>`).join('')}</div><p class="note" style="margin-top:18px">Hay una palabra que sobra o está mal. Tócala.</p>`;
    ex.innerHTML=h;
    ex.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{if(L.phase!=='ask')return;
      ex.querySelectorAll('.tok').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');L.sel=+b.dataset.t;go.disabled=false});
  }
  else if(d.t==='listen'&&r.mode==='typed'){
    h+=speakBtns()+`<textarea id="inp" placeholder="Escribe en inglés lo que oyes…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>`;
    ex.innerHTML=h;bindSpeak(d.en);bindInput();
  }
  else if(d.t==='order'||d.t==='listen'){
    const audio=d.t==='listen'&&canSpeak;
    L.bank=shuffle(d.en.split(' ').concat(d.extra||[]));L.ans=[];
    h+=audio?speakBtns():`<div class="es">${esc(d.es)}</div>`;
    h+=`<div class="answer-line" id="aline"></div><div class="bank" id="bank"></div>`;
    ex.innerHTML=h;if(audio)bindSpeak(d.en);
    drawTiles();
  }
  else if(d.t==='write'){
    h+=`<div class="es">${esc(d.es)}</div><textarea id="inp" placeholder="Escribe en inglés…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>`;
    ex.innerHTML=h;bindInput();
  }
  else if(d.t==='match'){
    const idx=d.pairs.map((_,k)=>k);L.m={l:shuffle(idx),r:shuffle(idx),sl:null,sr:null,ok:new Set()};
    h+=`<div class="match"><div class="col" id="ml"></div><div class="col" id="mr"></div></div>`;
    ex.innerHTML=h;go.hidden=true;drawMatch();
  }
  $('.l-body').scrollTop=0;
}
function drawTiles(){
  const go=$('#go');
  $('#aline').innerHTML=L.ans.map((bi,k)=>`<button class="tile" data-a="${k}">${esc(L.bank[bi])}</button>`).join('');
  $('#bank').innerHTML=L.bank.map((w,k)=>`<button class="tile ${L.ans.includes(k)?'used':''}" data-b="${k}" ${L.ans.includes(k)?'tabindex="-1" aria-hidden="true"':''}>${esc(w)}</button>`).join('');
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(L.phase!=='ask'||L.ans.includes(+b.dataset.b))return;L.ans.push(+b.dataset.b);drawTiles()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(L.phase!=='ask')return;L.ans.splice(+b.dataset.a,1);drawTiles()});
  go.disabled=!L.ans.length;
}
function drawMatch(){
  const{d}=cur(),m=L.m;
  const cell=(side,k,txt)=>{const sel=side==='l'?m.sl===k:m.sr===k;return `<button class="mt ${m.ok.has(k)?'ok':''}" data-${side}="${k}" aria-pressed="${sel}" ${m.ok.has(k)?'disabled':''}>${esc(txt)}</button>`};
  $('#ml').innerHTML=m.l.map(k=>cell('l',k,d.pairs[k][0])).join('');
  $('#mr').innerHTML=m.r.map(k=>cell('r',k,d.pairs[k][1])).join('');
  document.querySelectorAll('.mt[data-l]').forEach(b=>b.onclick=()=>{const k=+b.dataset.l;m.sl=k;speak(d.pairs[k][0]);pickMatch()});
  document.querySelectorAll('.mt[data-r]').forEach(b=>b.onclick=()=>{m.sr=+b.dataset.r;pickMatch()});
}
function pickMatch(){
  const m=L.m,{d}=cur();
  if(m.sl===null||m.sr===null){drawMatch();return}
  if(m.sl===m.sr){m.ok.add(m.sl);m.sl=m.sr=null;drawMatch();if(m.ok.size===d.pairs.length)resolve(true,'')}
  else{const a=m.sl,b=m.sr;m.sl=m.sr=null;drawMatch();
    const l=document.querySelector(`[data-l="${a}"]`),r=document.querySelector(`[data-r="${b}"]`);
    [l,r].forEach(x=>x&&x.classList.add('no'));setTimeout(()=>[l,r].forEach(x=>x&&x.classList.remove('no')),450)}
}
function check(){
  const{d,r}=cur();let res={ok:false},ans='';
  const v=()=>($('#inp')||{}).value||'';
  switch(d.t){
    case 'gap': if(r.mode==='typed')res=anyMatch(v(),[d.o[0]],true);else res={ok:L.sel===d.o[0]};ans=fill(d.s,d.o[0]);break;
    case 'mc': res={ok:L.sel===d.o[0]};ans=d.o[0];break;
    case 'open': res=anyMatch(v(),d.ans,false);ans=fill(d.s,res.ok?res.a:d.ans[0]);break;
    case 'wf': res=anyMatch(v(),d.ans,true);ans=fill(d.s,d.ans[0]);break;
    case 'kwt': res=anyMatch(v(),d.ans.concat(d.ans.map(a=>fill(d.s2,a))),true);ans=fill(d.s2,res.ok&&!res.typo&&d.ans.includes(res.a)?res.a:d.ans[0]);break;
    case 'err': res={ok:L.bad.includes(L.sel)};ans=d.fix;
      document.querySelectorAll('.tok').forEach((b,k)=>{if(L.bad.includes(k))b.classList.add('right');else if(k===L.sel)b.classList.add('wrong')});break;
    case 'write': res=anyMatch(v(),d.ans,true);ans=(res.ok&&!res.typo?res.a:d.ans[0])+'.';break;
    case 'listen': if(r.mode==='typed'){res=anyMatch(v(),[d.en],true);ans=d.en+'.';break}
    /* fall through */
    case 'order': res={ok:norm(L.ans.map(k=>L.bank[k]).join(' '))===norm(d.en)};ans=d.en+'.';break;
  }
  resolve(res.ok,ans,res.typo);
}
function englishOf(d){
  return {gap:fill(d.s||'',d.o?d.o[0]:''),open:d.ans&&d.s?fill(d.s,d.ans[0]):'',wf:d.ans&&d.s?fill(d.s,d.ans[0]):'',kwt:d.s2?fill(d.s2,d.ans[0]):'',err:d.fix,write:d.ans?d.ans[0]:'',order:d.en,listen:d.en,mc:'',match:''}[d.t]||'';
}
function resolve(ok,ans,typo){
  const{d,id,r}=cur();L.phase='fb';
  const first=!L.missed.has(id);
  if(first){S.seen[id]=(S.seen[id]||0)+1}
  const en=d.t==='mc'?(/[áéíóúñ¿¡]/i.test(d.o[0])?'':d.o[0]):d.t==='open'||d.t==='write'||d.t==='kwt'?ans.replace(/\.$/,''):englishOf(d);
  const spk=en&&canSpeak?`<button aria-label="Escuchar" data-say="${esc(en)}">${I.speaker}</button>`:'';
  if(ok){
    L.done++;L.xp+=first?10:5;
    if(L.mode==='review'||!first)S.mist=S.mist.filter(x=>x!==id);
    const praise=['¡Muy bien!','¡Perfecto!','¡Correcto!','¡Genial!','¡Así se hace!','¡Impecable!'][Math.random()*6|0];
    const show=d.t!=='mc'&&d.t!=='match';
    setFoot('good',`<h3>${I.check}${praise}</h3>${typo?`<div class="ans">Ojo con la ortografía: ${esc(ans)}${spk}</div>`:(show&&en?`<div class="ans">${esc(ans)}${spk}</div>`:'')}`);
  }else{
    L.miss++;L.missed.add(id);
    L.queue.push(Object.assign({},r));
    if(!S.mist.includes(id))S.mist.push(id);if(S.mist.length>60)S.mist.shift();
    if(L.mode!=='review'){loseHeart();lessonHearts()}
    setFoot('bad',`<h3>${I.x}Respuesta correcta:</h3><div class="ans">${esc(ans)}${spk}</div>${d.tip?`<div class="tip">${esc(d.tip)}</div>`:''}`);
  }
  save();
  $('#bar').style.width=(L.done/L.total*100)+'%';
  const go=$('#go');go.hidden=false;go.disabled=false;go.textContent='Continuar';go.className='btn '+(ok?'good':'bad');go.focus({preventScroll:true});
  const sb2=document.querySelector('[data-say]');if(sb2)sb2.onclick=()=>speak(sb2.dataset.say);
}
$('#go').onclick=()=>{
  if(L.phase==='ask')return check();
  if(L.phase==='fb'){
    if(L.mode!=='review'&&S.hearts===0)return endLesson(false);
    L.pos++;if(L.pos>=L.queue.length)return endLesson(true);
    showEx();
  }else if(L.phase==='end')closeLesson();
};
document.addEventListener('keydown',e=>{
  if($('#lesson').hidden||e.key!=='Enter'||['TEXTAREA','BUTTON','INPUT'].includes(e.target.tagName))return;
  const go=$('#go');if(!go.disabled&&!go.hidden)go.click();
});
function endLesson(win){
  L.phase='end';setFoot('');
  const go=$('#go');go.className='btn';go.textContent='Continuar';go.hidden=false;go.disabled=false;
  if(!win){
    $('#ex').innerHTML=`<div class="result"><div class="badge sad">${I.heart}</div><h1>Sin vidas</h1><p>Recuperas una cada 20 minutos. Completa un repaso para ganar una ya.</p></div>`;
    save();return;
  }
  const perfect=L.miss===0;if(perfect)L.xp+=5;
  const isExam=L.mode==='unit'&&LESSONS[L.n].exam;if(isExam)L.xp+=10;
  const today=ymd();
  if(S.last!==today){S.streak=S.last===yest()?S.streak+1:1;S.last=today}
  S.best=Math.max(S.best,S.streak);
  S.xp+=L.xp;S.days[today]=(S.days[today]||0)+L.xp;
  let msg='Lección completada.';
  if(L.mode==='unit'&&L.n===S.prog[L.u]){S.prog[L.u]++;msg=S.prog[L.u]===NL?(L.u<UNITS.length-1?`¡Unidad ${L.u+1} superada! Se abre la unidad ${L.u+2}.`:'¡Has completado toda la ruta B2!'):'Siguiente lección desbloqueada.'}
  if(L.mode==='practice')msg='Práctica completada. Puedes repetirla cuantas veces quieras: los ejercicios cambian.';
  if(L.mode==='review'){S.hearts=Math.min(MAXH,S.hearts+1);msg='Repaso completado. +1 vida.'}
  save();
  const acc=Math.round(L.total/(L.total+L.miss)*100);
  $('#bar').style.width='100%';
  $('#ex').innerHTML=`<div class="result"><div class="badge">${isExam?I.cap:I.star}</div><h1>${perfect?'¡Lección perfecta!':isExam?'¡Examen superado!':'¡Lección superada!'}</h1><p>${msg}</p>
   <div class="trio"><div><b>+${L.xp}</b><span>XP</span></div><div><b>${acc}%</b><span>Acierto</span></div><div><b>${S.streak}</b><span>Racha</span></div></div></div>`;
}
function closeLesson(){try{speechSynthesis.cancel()}catch(e){}$('#lesson').hidden=true;document.body.style.overflow='';L=null;render()}
$('#quit').onclick=()=>{
  if(!L||L.phase==='end')return closeLesson();
  confirmDlg('¿Salir de la lección?','Perderás el progreso de esta lección. Las vidas gastadas no se recuperan.','Salir',closeLesson,'Seguir aprendiendo');
};

render();
initCloud();
setInterval(()=>{if($('#lesson').hidden)renderStats()},15000);

</script>
</body>
</html>
